<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CodeWithGaurav</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css"> <!-- Adjusted path for static serving -->
</head>
<body class="bg-gray-100">
    <!-- Navigation Bar -->
    <nav class="bg-gray-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold hover:text-gray-300 transition-colors">CodeWithGaurav</a>
            <!-- Mobile Menu Button -->
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-4 items-center">
                <a href="/" class="hover:text-gray-400 transition-colors">Home</a>
                <a href="/courses" class="hover:text-gray-400 transition-colors">Courses</a>
                <a href="/tutorials" class="hover:text-gray-400 transition-colors">Tutorials</a>
                <a href="/projects" class="hover:text-gray-400 transition-colors">Projects</a>
                <a href="/notes" class="hover:text-gray-400 transition-colors">Notes</a>
                <a id="login-nav-item" href="/login" class="hover:text-gray-400 transition-colors">Login</a>
                <a id="register-nav-item" href="/register" class="hover:text-gray-400 transition-colors text-yellow-400 font-semibold">Register</a>
                <div id="logged-in-user-info" class="text-sm text-gray-300"></div>
                <button id="logout-nav-item" style="display:none;" onclick="logoutUser()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition-colors hover:scale-105 transform">Logout</button>
            </div>
        </div>
        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden mt-2 space-y-2">
            <a href="/" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors">Home</a>
            <a href="/courses" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors">Courses</a>
            <a href="/tutorials" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors">Tutorials</a>
            <a href="/projects" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors">Projects</a>
            <a href="/notes" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors">Notes</a>
            <a id="login-nav-item-mobile" href="/login" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors">Login</a>
            <a id="register-nav-item-mobile" href="/register" class="block px-4 py-2 hover:bg-gray-700 rounded transition-colors text-yellow-400 font-semibold">Register</a>
            <button id="logout-nav-item-mobile" style="display:none;" onclick="logoutUser()" class="block text-center w-full px-4 py-2 bg-red-500 hover:bg-red-700 text-white font-bold rounded mt-2 transition-colors hover:scale-105 transform">Logout</button>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container mx-auto mt-10 md:mt-20 p-4 flex justify-center">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold mb-6 text-center text-gray-700">Create Account</h2>
            <form id="register-form">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" name="email" required
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           placeholder="you@example.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" name="password" required minlength="6"
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           placeholder="******************">
                </div>
                <div class="mb-6">
                    <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required minlength="6"
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                           placeholder="******************">
                </div>
                <div class="flex items-center justify-between mb-6">
                    <button type="submit"
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition-colors hover:scale-105 transform">
                        Register
                    </button>
                </div>
                <p id="register-error" class="text-red-500 text-xs italic mb-4 text-center"></p>
                <p class="text-center text-gray-600 text-sm">
                    Already have an account? <a href="/login" class="text-blue-500 hover:text-blue-700 font-semibold">Login here</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/script.js" defer></script> <!-- Add main script for mobile menu -->
</body>
</html>
